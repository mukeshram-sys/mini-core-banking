{% extends "base.html" %}
{% block body %}
<i class="coin"></i><i class="coin"></i><i class="coin"></i>
<section class="auth rise">
  <h1>Open an account</h1>
  <p class="sub">Your account number is created instantly.</p>
  <form method="post" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label>Full name <input name="full_name" required></label>
    <label>Username <input name="username" required pattern="[A-Za-z0-9]{3,30}"></label>
    <label>Password (8+ characters) <input name="password" type="password" minlength="8" required></label>
    <button>Create account</button>
    <p class="sub">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
  </form>
</section>
{% endblock %}
